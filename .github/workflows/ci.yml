name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: datapilot_test, POSTGRES_USER: datapilot, POSTGRES_PASSWORD: test-only-password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datapilot -d datapilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://datapilot:test-only-password@localhost:5432/datapilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: ruff format --check app/auth.py app/config.py app/main.py app/rate_limit.py tests/test_production_foundation.py
      - run: alembic upgrade head
      - run: python ../scripts/verify_postgres_migrations.py
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
