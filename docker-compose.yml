name: datapilot
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datapilot}
      POSTGRES_USER: ${POSTGRES_USER:-datapilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapilot-local-only}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["datapilot_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: {context: ./backend}
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-before-deploying}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-datapilot}:${POSTGRES_PASSWORD:-datapilot-local-only}@postgres:5432/${POSTGRES_DB:-datapilot}
      UPLOAD_DIR: /app/data/uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: ["datapilot_uploads:/app/data/uploads"]
    ports: ["${BACKEND_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    build: {context: ./frontend}
    ports: ["${FRONTEND_PORT:-80}:8080"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  datapilot_postgres:
  datapilot_uploads:
