services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datapilot
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: datapilot
    ports:
      - "5432:5432"
    volumes:
      - datapilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot -d datapilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datapilot_postgres:
